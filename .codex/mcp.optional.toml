# НЕОБЯЗАТЕЛЬНЫЙ ШАБЛОН — НЕ ЗАГРУЖАЕТСЯ АВТОМАТИЧЕСКИ.
# Установленная AI Dev Team является источником истины для общих MCP servers.
# Не добавляй server, уже существующий на глобальном или пользовательском уровне.

# Только пример. Включай, только если существующая установка ещё не предоставляет
# актуальную документацию OpenAI/Codex через эквивалентный доверенный источник.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false
required = false
default_tools_approval_mode = "auto"
tool_timeout_sec = 60

# Только пример. При наличии предпочитай существующую GitHub-интеграцию AI Dev Team.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/x/repos"
auth = "oauth"
enabled = false
required = false
default_tools_approval_mode = "writes"
tool_timeout_sec = 60
