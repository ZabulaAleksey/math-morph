[workspace]
resolver = "3"
members = [
    "crates/math-model",
    "crates/document-ir",
    "crates/mathcad-parser",
    "crates/math-engine",
    "crates/exporter-docx",
    "crates/exporter-mathml",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
quick-xml = { version = "=0.41.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
